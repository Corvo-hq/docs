<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Two IAM grants</title><desc id="desc">Step 3 gives corvo-agent project read roles. Step 4 gives the Corvo runtime Token Creator on corvo-agent itself.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#315fbd" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<g font-family="Inter, Noto Sans CJK TC, Arial, sans-serif">
<text x="40" y="48" font-size="28" fill="#202124" font-weight="600" text-anchor="start">Two IAM grants, in different places</text>
<text x="40" y="102" font-size="20" fill="#315fbd" font-weight="600" text-anchor="start">Step 3 · Project IAM</text>
<text x="40" y="148" font-size="23" fill="#202124" font-weight="600" text-anchor="start">corvo-agent</text>
<text x="40" y="178" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">The account that reads your data</text>
<path d="M342 148H628" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="386" y="129" font-size="17" fill="#315fbd" font-weight="400" text-anchor="start">Read roles</text>
<rect x="652" y="105" width="308" height="107" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="674" y="146" font-size="22" fill="#202124" font-weight="600" text-anchor="start">Your project</text>
<text x="674" y="180" font-size="18" fill="#62656b" font-weight="400" text-anchor="start">Logging Viewer, …</text>
<path d="M40 242L960 242" stroke="#dadce0" fill="none"/>
<text x="40" y="286" font-size="20" fill="#315fbd" font-weight="600" text-anchor="start">Step 4 · Service account access</text>
<text x="40" y="334" font-size="23" fill="#202124" font-weight="600" text-anchor="start">Corvo runtime identity</text>
<text x="40" y="364" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">Copy its email from the wizard</text>
<path d="M342 334H628" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="315" font-size="17" fill="#315fbd" font-weight="400" text-anchor="start">Token Creator</text>
<rect x="652" y="291" width="308" height="107" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="674" y="332" font-size="22" fill="#202124" font-weight="600" text-anchor="start">corvo-agent</text>
<text x="674" y="366" font-size="18" fill="#62656b" font-weight="400" text-anchor="start">Grant on this account</text>
<rect x="40" y="432" width="920" height="57" rx="6" fill="#f0f4fc" stroke="none"/>
<text x="60" y="467" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Service Accounts → corvo-agent → Principals with access → Grant access</text>
</g></svg>
