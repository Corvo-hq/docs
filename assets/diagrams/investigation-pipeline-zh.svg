<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">告警如何整理成調查</title><desc id="desc">範例：兩筆結帳錯誤加入調查 A，背景工作錯誤加入調查 B。稍後的結帳錯誤會延續調查 A。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#315fbd" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="610" fill="#ffffff"/>
<g font-family="Inter, Noto Sans CJK TC, Arial, sans-serif">
<text x="40" y="48" font-size="28" fill="#202124" font-weight="600" text-anchor="start">告警如何整理成調查</text>
<text x="40" y="83" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">以下以共同原因分組為例</text>
<text x="40" y="137" font-size="19" fill="#202124" font-weight="600" text-anchor="start">收到的日誌</text>
<text x="385" y="137" font-size="19" fill="#202124" font-weight="600" text-anchor="start">依可能原因分派</text>
<text x="700" y="137" font-size="19" fill="#202124" font-weight="600" text-anchor="start">持續追蹤的調查</text>
<rect x="40" y="166" width="285" height="52" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="55" y="198" font-size="15" fill="#62656b" font-weight="400" text-anchor="start">10:02</text>
<text x="120" y="198" font-size="17" fill="#202124" font-weight="400" text-anchor="start">checkout · 500</text>
<rect x="40" y="236" width="285" height="52" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="55" y="268" font-size="15" fill="#62656b" font-weight="400" text-anchor="start">10:03</text>
<text x="120" y="268" font-size="17" fill="#202124" font-weight="400" text-anchor="start">checkout · 500</text>
<rect x="40" y="330" width="285" height="52" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="55" y="362" font-size="15" fill="#62656b" font-weight="400" text-anchor="start">10:04</text>
<text x="120" y="362" font-size="17" fill="#202124" font-weight="400" text-anchor="start">worker · timeout</text>
<path d="M325 192H355V260H383" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325 262H383" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M325 356H383" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="385" y="207" width="236" height="192" rx="0" fill="#f0f4fc" stroke="none"/>
<text x="406" y="242" font-size="20" fill="#202124" font-weight="600" text-anchor="start">分派流程</text>
<text x="406" y="276" font-size="17" fill="#202124" font-weight="400" text-anchor="start">比對這批告警</text>
<text x="406" y="307" font-size="17" fill="#202124" font-weight="400" text-anchor="start">與過去的調查</text>
<text x="406" y="370" font-size="16" fill="#315fbd" font-weight="400" text-anchor="start">新原因或既有原因？</text>
<path d="M621 260H666V221H696" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M621 356H696" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="171" width="260" height="105" rx="7" fill="#ffffff" stroke="#dadce0"/>
<rect x="715" y="158" width="32" height="25" rx="3" fill="#315fbd" stroke="#315fbd"/>
<text x="731" y="176" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">A</text>
<text x="718" y="212" font-size="21" fill="#202124" font-weight="600" text-anchor="start">checkout</text>
<text x="718" y="247" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">2 筆告警・相同原因</text>
<rect x="700" y="307" width="260" height="105" rx="7" fill="#ffffff" stroke="#dadce0"/>
<rect x="715" y="294" width="32" height="25" rx="3" fill="#315fbd" stroke="#315fbd"/>
<text x="731" y="312" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">B</text>
<text x="718" y="348" font-size="21" fill="#202124" font-weight="600" text-anchor="start">worker</text>
<text x="718" y="383" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">1 筆告警・不同原因</text>
<path d="M40 451L960 451" stroke="#dadce0" fill="none"/>
<text x="40" y="489" font-size="20" fill="#202124" font-weight="600" text-anchor="start">錯誤再次發生時</text>
<text x="40" y="524" font-size="18" fill="#202124" font-weight="400" text-anchor="start">10:18・再次出現結帳錯誤</text>
<path d="M359 518H674V247H696" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<text x="394" y="505" font-size="18" fill="#315fbd" font-weight="400" text-anchor="start">繼續調查 A</text>
<text x="40" y="577" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">每次發生都保留紀錄；已結束的調查可以繼續。</text>
</g></svg>
