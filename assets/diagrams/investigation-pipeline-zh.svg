<svg xmlns="http://www.w3.org/2000/svg" width="1112" height="400" viewBox="0 0 1112 400" role="img" aria-label="調查流程"><style>.title{font:700 25px Arial,sans-serif;fill:#0f172a}.subtitle{font:15px Arial,sans-serif;fill:#475569}.head{font:700 16px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#475569}.number{font:700 15px Arial,sans-serif;fill:#fff}.note{font:15px Arial,sans-serif;fill:#334155}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="1110" height="398" rx="20" fill="#f8fafc" stroke="#e2e8f0"/><text x="30" y="47" class="title">調查流程</text><text x="30" y="75" class="subtitle">只轉送你選定的 Google Cloud 日誌。</text><g><rect x="30" y="126" width="180" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="57" cy="157" r="15" fill="#4285f4"/><text x="57" y="162" text-anchor="middle" class="number">1</text><text x="47" y="205" class="head">雲端日誌</text><text x="47" y="238" class="body">符合條件的錯誤</text></g><g><rect x="248" y="126" width="180" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="275" cy="157" r="15" fill="#0ea5e9"/><text x="275" y="162" text-anchor="middle" class="number">2</text><text x="265" y="205" class="head">收集告警</text><text x="265" y="238" class="body">短暫的收集時段</text></g><g><rect x="466" y="126" width="180" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="493" cy="157" r="15" fill="#8b5cf6"/><text x="493" y="162" text-anchor="middle" class="number">3</text><text x="483" y="205" class="head">分派流程</text><text x="483" y="238" class="body">依可能原因分組</text></g><g><rect x="684" y="126" width="180" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="711" cy="157" r="15" fill="#6366f1"/><text x="711" y="162" text-anchor="middle" class="number">4</text><text x="701" y="205" class="head">Agent 對話</text><text x="701" y="238" class="body">沿用或新建</text></g><g><rect x="902" y="126" width="180" height="145" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="929" cy="157" r="15" fill="#10b981"/><text x="929" y="162" text-anchor="middle" class="number">5</text><text x="919" y="205" class="head">審查結果</text><text x="919" y="238" class="body">分析報告或 PR</text></g><path d="M210 198 H238 M428 198 H456 M646 198 H674 M864 198 H892" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="312" width="1052" height="55" rx="12" fill="#eef2ff" stroke="#c7d2fe"/><text x="48" y="345" class="note">日後的相關告警可以加入同一項調查；每次發生仍會保留紀錄。</text></svg>
