<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title desc">
<title id="title">Telegram: conversation and notifications</title><desc id="desc">The Agent bot handles questions in Telegram. The Notify bot sends alerts and links to investigations on the web.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#315fbd" stroke-width="1.7"/></marker></defs>
<rect width="1000" height="565" fill="#ffffff"/>
<g font-family="Inter, Noto Sans CJK TC, Arial, sans-serif">
<text x="40" y="48" font-size="28" fill="#202124" font-weight="600" text-anchor="start">Telegram: two bot identities</text>
<path d="M40 266L960 266" stroke="#dadce0" fill="none"/>
<text x="40" y="136" font-size="19" fill="#202124" font-weight="600" text-anchor="start">You ask a question</text>
<text x="40" y="168" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Message or @mention</text>
<path d="M269 151H357" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="111" width="240" height="114" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="402" y="150" font-size="25" fill="#202124" font-weight="600" text-anchor="start">Agent bot</text>
<text x="402" y="189" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Called “chat bot” in Corvo</text>
<path d="M620 151H706" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="729" y="138" font-size="21" fill="#315fbd" font-weight="600" text-anchor="start">Reply in Telegram</text>
<text x="729" y="172" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Continue with the Agent bot</text>
<path d="M40 473L960 473" stroke="#dadce0" fill="none"/>
<text x="40" y="343" font-size="19" fill="#202124" font-weight="600" text-anchor="start">An investigation updates</text>
<text x="40" y="375" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Send notification</text>
<path d="M269 358H357" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="318" width="240" height="114" rx="6" fill="#fafafa" stroke="#dadce0"/>
<text x="402" y="357" font-size="25" fill="#202124" font-weight="600" text-anchor="start">Notify bot</text>
<text x="402" y="396" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Called “alerts bot” in Corvo</text>
<path d="M620 358H706" fill="none" stroke="#315fbd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="729" y="345" font-size="21" fill="#315fbd" font-weight="600" text-anchor="start">Open in Corvo</text>
<text x="729" y="379" font-size="16" fill="#62656b" font-weight="400" text-anchor="start">Read or continue the investigation</text>
<text x="40" y="514" font-size="18" fill="#202124" font-weight="400" text-anchor="start">Reply to a tracked alert → the Notify bot returns its web investigation link.</text>
<text x="40" y="546" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">Bind the chat bot first, then use “Connect alerts bot”.</text>
</g></svg>
