<text x="61" y="329" font-size="17" fill="#62656b" font-weight="400" text-anchor="start">Prepare repositories and setup commands</text>
<text x="596" y="165" font-size="24" fill="#202124" font-weight="600" text-anchor="start">Permissions</text>
<text x="596" y="199" font-size="18" fill="#62656b" font-weight="400" text-anchor="start">Allow or block Git / GitHub actions</text>
