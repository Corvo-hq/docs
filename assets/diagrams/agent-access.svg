<text x="40" y="48" font-size="28" fill="#202124" font-weight="600" text-anchor="start">Repository access and allowed actions</text>
<text x="40" y="104" font-size="21" fill="#315fbd" font-weight="600" text-anchor="start">Which repositories?</text>
<text x="596" y="104" font-size="21" fill="#315fbd" font-weight="600" text-anchor="start">Which operations?</text>
<path d="M550 94L550 351" stroke="#dadce0" fill="none" stroke-dasharray="5 6"/>
