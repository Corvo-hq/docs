<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Repository access and allowed actions</title><desc id="desc">The GitHub App grants repository access, the environment prepares selected repositories, and permission switches govern Git and GitHub operations.</desc>
