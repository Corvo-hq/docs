<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-label="Google Cloud to Corvo"><style>.title{font:700 25px Arial,sans-serif;fill:#0f172a}.subtitle{font:15px Arial,sans-serif;fill:#475569}.head{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#475569}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect x="1" y="1" width="1098" height="463" rx="20" fill="#f8fafc" stroke="#e2e8f0"/><text x="40" y="48" class="title">Google Cloud to Corvo</text><text x="40" y="77" class="subtitle">Alert delivery and investigation access are separate.</text><g><rect x="40" y="112" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="40" y="112" width="8" height="104" rx="4" fill="#4285f4"/><text x="62" y="150" class="head">Cloud Logging</text><text x="62" y="179" class="body">Selected error entries</text></g><g><rect x="310" y="112" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="310" y="112" width="8" height="104" rx="4" fill="#34a853"/><text x="332" y="150" class="head">Log sink</text><text x="332" y="179" class="body">Severity + source filter</text></g><g><rect x="580" y="112" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="580" y="112" width="8" height="104" rx="4" fill="#10b981"/><text x="602" y="150" class="head">Corvo Pub/Sub</text><text x="602" y="179" class="body">Sink writer publishes</text></g><g><rect x="850" y="112" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="850" y="112" width="8" height="104" rx="4" fill="#6366f1"/><text x="872" y="150" class="head">Investigations</text><text x="872" y="179" class="body">Alerts grouped by cause</text></g><path d="M270 164 H298 M540 164 H568 M810 164 H838" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M405 362 H683" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="282" class="label">INVESTIGATION ACCESS</text><g><rect x="175" y="310" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="175" y="310" width="8" height="104" rx="4" fill="#f59e0b"/><text x="197" y="348" class="head">Corvo runtime</text><text x="197" y="377" class="body">Short-lived credentials</text></g><g><rect x="695" y="310" width="230" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="695" y="310" width="8" height="104" rx="4" fill="#6366f1"/><text x="717" y="348" class="head">corvo-agent</text><text x="717" y="377" class="body">Read roles in your project</text></g></svg>
